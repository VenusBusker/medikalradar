<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClinicalRadar — Interactive Case & Medical Learning Hub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f1ea; color: #2b2b2b; line-height: 1.6; }
        
        header { background: #8b0000; color: #fff; padding: 22px 0; text-align: center; border-bottom: 4px solid #5c0000; }
        header h1 { font-family: Georgia, serif; font-size: 2.3em; font-weight: normal; letter-spacing: 1px; }
        header p { font-size: 0.95em; opacity: 0.85; margin-top: 4px; }

        /* Filtreleme Barları */
        .filter-bar { background: #fff; border-bottom: 1px solid #dcd6cd; padding: 12px 20px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .filter-btn { background: #f0eae1; border: 1px solid #ccc; color: #444; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 0.85em; font-weight: 600; transition: all 0.2s ease; }
        .filter-btn:hover, .filter-btn.active { background: #8b0000; color: #fff; border-color: #8b0000; }
        .filter-btn.bookmark-filter { background: #fff8e1; border-color: #ffb300; color: #b78103; }
        .filter-btn.bookmark-filter:hover, .filter-btn.bookmark-filter.active { background: #ffb300; color: #fff; }

        /* Layout Grid */
        .container { max-width: 1240px; margin: 25px auto; padding: 0 20px; display: flex; gap: 30px; align-items: flex-start; }
        .main-content { flex: 2; min-width: 0; }
        .sidebar { flex: 1; background: #fff; border: 1px solid #dcd6cd; border-radius: 8px; padding: 20px; position: sticky; top: 20px; }
        .sidebar-title { font-family: Georgia, serif; font-size: 1.2em; color: #8b0000; margin-bottom: 15px; padding-bottom: 8px; border-bottom: 2px solid #8b0000; display: flex; justify-content: space-between; align-items: center; }
        .sidebar-title span { font-size: 0.75em; background: #f0eae1; color: #555; padding: 2px 8px; border-radius: 12px; font-family: sans-serif; }

        /* Vaka Kartları */
        .interactive-card { background: #fff; border: 1px solid #dcd6cd; border-radius: 8px; padding: 25px; margin-bottom: 25px; box-shadow: 0 3px 8px rgba(0,0,0,0.04); position: relative; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-right: 35px; }
        .badge { font-size: 0.75em; font-weight: bold; text-transform: uppercase; padding: 3px 10px; border-radius: 12px; }
        .badge-cat { background: #e8f0fe; color: #1a73e8; }
        .badge-red { background: #fce8e6; color: #c5221f; }
        .badge-yellow { background: #fef7e0; color: #b06000; }
        .badge-green { background: #e6f4ea; color: #137333; }
        
        /* Bookmark Butonu */
        .bookmark-btn { position: absolute; top: 22px; right: 22px; background: transparent; border: none; font-size: 1.4em; cursor: pointer; color: #ccc; transition: 0.2s; }
        .bookmark-btn.active { color: #ffb300; transform: scale(1.1); }
        .bookmark-btn:hover { color: #ffb300; }

        .case-title { font-family: Georgia, serif; font-size: 1.35em; color: #111; margin-bottom: 15px; line-height: 1.3; }
        .patient-history { background: #faf8f5; border-left: 4px solid #8b0000; padding: 15px; font-size: 0.98em; color: #222; margin-bottom: 18px; line-height: 1.7; }
        
        .diagnosis-box { padding: 18px; background: #eef2f5; border-radius: 6px; border-left: 4px solid #1a73e8; margin-bottom: 15px; }
        .diag-title { font-weight: bold; color: #1a73e8; font-size: 1.05em; margin-bottom: 8px; font-family: Georgia, serif; }

        /* 🔥 HIGH-YIELD CLINICAL PEARL KUTUSU */
        .pearl-box { background: #fffde7; border: 1px solid #fff59d; border-left: 4px solid #fbc02d; padding: 15px; border-radius: 6px; font-size: 0.93em; color: #574300; }
        .pearl-title { font-weight: bold; color: #f57f17; font-size: 0.95em; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; display: flex; align-items: center; gap: 6px; }

        /* Sağ Taraf Makale Kartları */
        .article-card { background: #faf8f5; border: 1px solid #e5dfd5; border-radius: 6px; padding: 12px 15px; margin-bottom: 12px; cursor: pointer; transition: all 0.25s ease; text-decoration: none; color: inherit; display: block; }
        .article-card:hover { transform: translateY(-3px); box-shadow: 0 5px 12px rgba(0,0,0,0.08); border-color: #8b0000; background: #fff; }
        .article-card-tag { font-size: 0.72em; color: #8b0000; font-weight: bold; text-transform: uppercase; margin-bottom: 3px; }
        .article-card-title { font-size: 0.88em; font-weight: 600; line-height: 1.35; color: #222; }

        @media (max-width: 850px) {
            .container { flex-direction: column; }
            .sidebar { position: static; width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <h1>ClinicalRadar</h1>
        <p>Interactive Clinical Cases & Medical Learning Hub</p>
    </header>

    <div class="filter-bar">
        <button class="filter-btn active" onclick="filterCases('ALL')">🌐 All Cases</button>
        <button class="filter-btn" onclick="filterCases('Cardiology')">🫀 Cardiology</button>
        <button class="filter-btn" onclick="filterCases('Neurology')">🧠 Neurology</button>
        <button class="filter-btn" onclick="filterCases('Surgery')">🔪 Surgery</button>
        <button class="filter-btn" onclick="filterCases('Red')">🔴 Emergency (Red)</button>
        <button class="filter-btn bookmark-filter" onclick="filterCases('BOOKMARKS')">🔖 Saved Cases (<span id="saved-count">0</span>)</button>
    </div>

    <div class="container">
        <main class="main-content" id="app">
            <p style="text-align:center; padding:30px;">Loading interactive clinical cases...</p>
        </main>

        <aside class="sidebar">
            <div class="sidebar-title">
                📄 Medical Papers
                <span id="article-count">0 Papers</span>
            </div>
            <div id="articles-list">
                <p style="font-size:0.85em; color:#777; text-align:center;">Loading literature...</p>
            </div>
        </aside>
    </div>

    <script src="app.js"></script>
</body>
</html>
