<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedikalRadar | Klinik Olgu Simülasyonları</title>
    <style>
        body { background-color: #f4f1ea; color: #1a1a1a; font-family: Arial, sans-serif; margin: 0; padding: 0; line-height: 1.7; }
        header { background-color: #e8e2d5; border-bottom: 2px solid #8b0000; padding: 30px 0; text-align: center; }
        .header-title { font-family: Georgia, serif; color: #8b0000; font-size: 2.4em; margin: 0; letter-spacing: 2px; text-transform: uppercase; }
        .sub-title { font-family: Georgia, serif; font-style: italic; color: #555; font-size: 1em; margin-top: 5px; }
        .top-bar { max-width: 800px; margin: 20px auto 0 auto; padding: 0 20px; display: flex; justify-content: flex-end; }
        .lang-btn { background: #e8e2d5; border: 1px solid #8b0000; color: #8b0000; padding: 6px 15px; font-family: Georgia, serif; cursor: pointer; font-weight: bold; }
        .container { max-width: 800px; margin: 20px auto 60px auto; padding: 0 20px; }
        .case-card { background: #ffffff; border: 1px solid #dcd6cd; padding: 35px; margin-bottom: 35px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .pmid-tag { font-family: Georgia, serif; color: #8b0000; font-size: 0.85em; text-transform: uppercase; border-bottom: 1px solid #e8e2d5; padding-bottom: 5px; margin-bottom: 15px; font-weight: bold; display: inline-block; }
        h2.case-title { font-family: Georgia, serif; color: #1a1a1a; font-size: 1.5em; font-weight: normal; margin: 0 0 20px 0; }
        .case-history { font-family: Arial, sans-serif; color: #333; font-size: 0.98em; margin-bottom: 25px; background: #f9f8f5; padding: 18px; border-left: 4px solid #8b0000; }
        .question-box { font-family: Georgia, serif; font-size: 1.05em; margin-bottom: 15px; font-weight: bold; }
        .options-list { list-style: none; padding: 0; margin: 0 0 20px 0; }
        .option-item { background: #f4f1ea; border: 1px solid #dcd6cd; padding: 12px 15px; margin-bottom: 8px; cursor: pointer; }
        .option-item:hover { background: #e8e2d5; border-color: #8b0000; }
        .option-item.correct { background: #e8f5e9 !important; border-color: #2e7d32 !important; color: #1b5e20 !important; font-weight: bold; }
        .option-item.wrong { background: #ffebee !important; border-color: #c62828 !important; color: #b71c1c !important; }
        .explanation-box { display: none; background: #f9f8f5; border: 1px dashed #8b0000; padding: 18px; margin-top: 20px; }
        .pubmed-link { display: inline-block; margin-top: 15px; color: #8b0000; text-decoration: none; font-family: Georgia, serif; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <h1 class="header-title">MEDİKALRADAR</h1>
    <div class="sub-title">Klinik Olgu Simülasyonları & Tıbbi Analizler</div>
</header>

<div class="top-bar">
    <button class="lang-btn" onclick="toggleLanguage()">Dil: TR | EN</button>
</div>

<div class="container" id="app">
    <!-- Vakalar Buraya Dinamik Yüklenecek -->
</div>

<script src="app.js"></script>
</body>
</html>
