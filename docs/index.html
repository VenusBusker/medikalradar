<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClinicalRadar — Interactive Case & Exam Prep Engine</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f1ea; color: #2b2b2b; line-height: 1.6; }
        
        header { background: #8b0000; color: #fff; padding: 20px 0; border-bottom: 4px solid #5c0000; }
        .header-inner { max-width: 1240px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; }
        .brand-title { font-family: Georgia, serif; font-size: 2.1em; font-weight: bold; }
        .brand-tagline { font-size: 0.85em; opacity: 0.85; }

        /* Controls & Active Recall Switcher */
        .control-bar { background: #fff; border-bottom: 1px solid #dcd6cd; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .filter-group { display: flex; gap: 8px; flex-wrap: wrap; }
        .filter-btn { background: #f0eae1; border: 1px solid #ccc; color: #444; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 0.82em; font-weight: 600; transition: all 0.2s; }
        .filter-btn:hover, .filter-btn.active { background: #8b0000; color: #fff; border-color: #8b0000; }
        
        /* Study Mode Toggle Switch */
        .study-mode-btn { background: #1a73e8; color: #fff; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 0.85em; transition: 0.3s; display: flex; align-items: center; gap: 6px; }
        .study-mode-btn:hover { background: #1557b0; }
        .study-mode-btn.active { background: #34a853; }

        /* Container Layout */
        .container { max-width: 1240px; margin: 25px auto; padding: 0 20px; display: flex; gap: 25px; align-items: flex-start; }
        .main-content { flex: 3; min-width: 0; }
        .sidebar { flex: 1.2; background: #fff; border: 1px solid #dcd6cd; border-radius: 6px; padding: 18px; position: sticky; top: 20px; max-height: calc(100vh - 40px); display: flex; flex-direction: column; }

        /* Interactive Clinical Card */
        .case-card { background: #fff; border: 1px solid #dcd6cd; border-radius: 8px; padding: 22px; margin-bottom: 25px; box-shadow: 0 3px 8px rgba(0,0,0,0.04); position: relative; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-right: 35px; }
        .badge { font-size: 0.72em; font-weight: bold; text-transform: uppercase; padding: 3px 9px; border-radius: 4px; }
        .badge-hy { background: #fef7e0; color: #b06000; border: 1px solid #f57f17; }
        .badge-cat { background: #e8f0fe; color: #1a73e8; }
        
        .case-title { font-family: Georgia, serif; font-size: 1.4em; color: #111; margin-bottom: 12px; line-height: 1.3; }
        .patient-history { background: #faf8f5; border-left: 4px solid #8b0000; padding: 14px; font-size: 0.95em; color: #222; margin-bottom: 15px; }

        /* Modül 1: Differential Diagnosis Table (Ayrıcı Tanı) */
        .ddx-box { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 6px; padding: 14px; margin-bottom: 15px; }
        .ddx-title { font-size: 0.85em; font-weight: bold; color: #495057; text-transform: uppercase; margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }
        .ddx-list { font-size: 0.88em; color: #333; padding-left: 18px; }

        /* Modül 2: First-Line Management (İlk Tedavi Şeması) */
        .mgmt-box { background: #e8f4ea; border-left: 4px solid #34a853; padding: 14px; border-radius: 4px; margin-bottom: 15px; font-size: 0.9em; color: #137333; }
        .mgmt-title { font-weight: bold; text-transform: uppercase; font-size: 0.85em; margin-bottom: 5px; }

        /* Active Recall Hidden Box */
        .answer-section { display: block; }
        .study-reveal-btn { width: 100%; background: #1a73e8; color: #fff; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.95em; }

        /* Flashcard Rating Buttons (Easy / Medium / Hard) */
        .rating-bar { display: flex; gap: 10px; margin-top: 15px; padding-top: 15px; border-top: 1px dashed #ccc; }
        .rate-btn { flex: 1; padding: 8px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.82em; }
        .rate-easy { background: #e6f4ea; color: #137333; }
        .rate-med { background: #fef7e0; color: #b06000; }
        .rate-hard { background: #fce8e6; color: #c5221f; }

        /* Bookmark Button */
        .bookmark-btn { position: absolute; top: 18px; right: 18px; background: transparent; border: none; font-size: 1.3em; cursor: pointer; color: #ccc; }
        .bookmark-btn.active { color: #ffb300; }

        /* Sidebar Scroll */
        .sidebar-scroll { overflow-y: auto; flex: 1; }
        .sidebar-item { padding: 10px 0; border-bottom: 1px dashed #e0dad0; display: block; text-decoration: none; color: inherit; }
        .sidebar-item-title { font-size: 0.85em; font-weight: 600; color: #222; }

        @media (max-width: 900px) {
            .container { flex-direction: column; }
            .sidebar { position: static; max-height: none; width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-inner">
            <div>
                <div class="brand-title">ClinicalRadar</div>
                <div class="brand-tagline">Clinical Decision & Active Learning Engine for Medical Students</div>
            </div>
        </div>
    </header>

    <div class="control-bar">
        <div class="filter-group">
            <button class="filter-btn active" onclick="filterCases('ALL')">🌐 All Cases</button>
            <button class="filter-btn" onclick="filterCases('Cardiology')">🫀 Cardiology</button>
            <button class="filter-btn" onclick="filterCases('Neurology')">🧠 Neurology</button>
            <button class="filter-btn" onclick="filterCases('Surgery')">🔪 Surgery</button>
            <button class="filter-btn" onclick="filterCases('BOOKMARKS')">🔖 Saved (<span id="saved-count">0</span>)</button>
        </div>

        <!-- ACTIVE RECALL / STUDY MODE SWITCH -->
        <button class="study-mode-btn" id="study-toggle" onclick="toggleStudyMode()">
            🧠 Active Recall Mode: OFF
        </button>
    </div>

    <div class="container">
        <main class="main-content" id="app">
            <p style="text-align:center; padding:30px;">Loading clinical learning engine...</p>
        </main>

        <aside class="sidebar">
            <div style="font-family:Georgia, serif; font-size:1.1em; color:#8b0000; padding-bottom:8px; border-bottom:2px solid #8b0000; margin-bottom:12px; display:flex; justify-content:space-between;">
                📄 Literature Stream
                <span id="article-count" style="font-size:0.75em; background:#f0eae1; color:#555; padding:2px 6px; border-radius:10px;">0</span>
            </div>
            <div class="sidebar-scroll" id="sidebar-scroll"></div>
        </aside>
    </div>

    <script src="app.js"></script>
</body>
</html>
