<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makale Detayı — MedikalRadar</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #fcfbf9; color: #2b2b2b; line-height: 1.8; }
        
        header { background: #8b0000; color: #fff; padding: 15px 0; text-align: center; font-family: Georgia, serif; }
        
        .article-container { max-width: 800px; margin: 40px auto; padding: 30px; background: #fff; border: 1px solid #e0dad0; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); }
        
        .category-badge { display: inline-block; background: #f0eae1; color: #8b0000; font-size: 0.85em; font-weight: bold; padding: 4px 12px; border-radius: 15px; margin-bottom: 15px; }
        .article-title { font-family: Georgia, serif; font-size: 2em; color: #111; line-height: 1.3; margin-bottom: 15px; }
        .meta-info { font-size: 0.85em; color: #777; border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 25px; }
        
        .section-heading { font-family: Georgia, serif; font-size: 1.2em; color: #8b0000; margin-top: 25px; margin-bottom: 10px; border-bottom: 1px solid #f0eae1; padding-bottom: 5px; }
        .content-box { font-size: 1.05em; color: #333; margin-bottom: 20px; white-space: pre-line; }

        .pubmed-footer { margin-top: 40px; padding-top: 20px; border-top: 2px dashed #e0dad0; text-align: center; font-size: 0.9em; }
        .pubmed-button { display: inline-block; background: #2e75b6; color: #fff; text-decoration: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; margin-top: 10px; transition: 0.3s; }
        .pubmed-button:hover { background: #1b4f7a; }
    </style>
</head>
<body>

    <header>
        <h2>MedikalRadar Literatür Arşivi</h2>
    </header>

    <div class="article-container" id="article-root">
        <p style="text-align:center;">Makale Yükleniyor...</p>
    </div>

    <script>
        async function loadArticleDetail() {
            const urlParams = new URLSearchParams(window.location.search);
            const pmid = urlParams.get('id');
            const root = document.getElementById('article-root');

            if (!pmid) {
                root.innerHTML = '<h3>Geçersiz veya bulunamayan makale.</h3>';
                return;
            }

            try {
                const response = await fetch('cases.json?v=' + new Date().getTime());
                const cases = await response.json();
                const article = cases.find(c => c.pmid === pmid);

                if (!article) {
                    root.innerHTML = '<h3>Makale arşivde bulunamadı.</h3>';
                    return;
                }

                document.title = `${article.title_tr || article.title_en} — MedikalRadar`;

                root.innerHTML = `
                    <span class="category-badge">📌 ${article.category || 'Genel Tıp'}</span>
                    <h1 class="article-title">${article.title_tr || article.title_en}</h1>
                    <div class="meta-info">
                        <strong>Yayın Tarihi:</strong> ${article.published_date || '2026'} | 
                        <strong>PMID:</strong> ${article.pmid} | 
                        <strong>Orijinal Başlık:</strong> <em>${article.title_en}</em>
                    </div>

                    <div class="section-heading">🩺 Klinik Öykü & Anamnez</div>
                    <div class="content-box">${article.history_tr || article.history_en}</div>

                    <div class="section-heading">📋 Klinik Seyir & Sonuç</div>
                    <div class="content-box">${article.explanation_tr || article.explanation_en}</div>

                    <div class="pubmed-footer">
                        <p>Bu metin açık erişimli kamu veritabanlarından derlenmiştir.</p>
                        <a href="${article.url}" target="_blank" class="pubmed-button">Orijinal Makaleyi PubMed Üzerinde İncele ↗</a>
                    </div>
                `;
            } catch (e) {
                root.innerHTML = '<h3>Makale yüklenirken bir hata oluştu.</h3>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadArticleDetail);
    </script>
</body>
</html>
