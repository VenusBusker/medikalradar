<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article Detail — Clinical Radar</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #fcfbf9; color: #2b2b2b; line-height: 1.8; }
        
        header { background: #8b0000; color: #fff; padding: 18px 0; text-align: center; font-family: Georgia, serif; font-size: 1.2em; }
        
        .article-container { max-width: 820px; margin: 40px auto; padding: 35px; background: #fff; border: 1px solid #e0dad0; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); }
        
        .category-badge { display: inline-block; background: #f0eae1; color: #8b0000; font-size: 0.85em; font-weight: bold; padding: 4px 12px; border-radius: 15px; margin-bottom: 15px; text-transform: uppercase; }
        .article-title { font-family: Georgia, serif; font-size: 2.1em; color: #111; line-height: 1.3; margin-bottom: 15px; }
        .meta-info { font-size: 0.85em; color: #777; border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 25px; }
        
        .section-heading { font-family: Georgia, serif; font-size: 1.25em; color: #8b0000; margin-top: 30px; margin-bottom: 12px; border-bottom: 1px solid #f0eae1; padding-bottom: 6px; text-transform: uppercase; }
        .content-box { font-size: 1.05em; color: #333; margin-bottom: 25px; text-align: justify; }

        .pubmed-footer { margin-top: 40px; padding-top: 20px; border-top: 2px dashed #e0dad0; text-align: center; font-size: 0.9em; color: #555; }
        .pubmed-button { display: inline-block; background: #8b0000; color: #fff; text-decoration: none; padding: 12px 24px; border-radius: 5px; font-weight: bold; margin-top: 12px; transition: 0.3s; }
        .pubmed-button:hover { background: #5c0000; }
    </style>
</head>
<body>

    <header>
        <h2>Medical Literature & Case Archive</h2>
    </header>

    <div class="article-container" id="article-root">
        <p style="text-align:center; padding:30px;">Loading article details...</p>
    </div>

    <script>
        async function loadArticleDetail() {
            const urlParams = new URLSearchParams(window.location.search);
            const pmid = urlParams.get('id');
            const root = document.getElementById('article-root');

            if (!pmid) {
                root.innerHTML = '<h3>Invalid or missing article ID.</h3>';
                return;
            }

            try {
                const response = await fetch('cases.json?v=' + new Date().getTime());
                const cases = await response.json();
                const article = cases.find(c => c.pmid === pmid);

                if (!article) {
                    root.innerHTML = '<h3>Article not found in archive.</h3>';
                    return;
                }

                document.title = `${article.title_en} — Medical Radar`;

                root.innerHTML = `
                    <span class="category-badge">📌 ${article.category || 'General Medicine'}</span>
                    <h1 class="article-title">${article.title_en}</h1>
                    <div class="meta-info">
                        <strong>Published:</strong> ${article.published_date || '2026'} | 
                        <strong>PMID:</strong> ${article.pmid} | 
                        <strong>Database:</strong> National Library of Medicine (PubMed)
                    </div>

                    <div class="section-heading">📖 Clinical Summary & Abstract</div>
                    <div class="content-box">${article.history_en}</div>

                    <div class="section-heading">💡 Diagnostic Outcome & Key Takeaways</div>
                    <div class="content-box">${article.explanation_en}</div>

                    <div class="pubmed-footer">
                        <p>This report is indexed from open-access medical literature databases.</p>
                        <a href="${article.url}" target="_blank" class="pubmed-button">Read Full Paper on PubMed ↗</a>
                    </div>
                `;
            } catch (e) {
                root.innerHTML = '<h3>Error loading article content.</h3>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadArticleDetail);
    </script>
</body>
</html>
